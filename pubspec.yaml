name: currency_converter
description: Currency Converter App with Eldorado.io API integration
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  bloc: ^8.1.4
  connectivity_plus: ^7.0.0
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  shared_preferences: ^2.5.3
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^2.4.4
  get_it: ^8.0.0
  go_router: ^14.2.7
  injectable: ^2.4.4
  intl: ^0.19.0
  json_annotation: ^4.9.0

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.12
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0
  flutter_gen: ^5.8.0
  flutter_gen_runner: ^5.8.0

flutter_gen:
  output: lib/src/core/utils/
  assets:
    outputs:
      class_name: DoradoAssets

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fiat_currencies/
    - assets/cripto_currencies/
    - assets/mocks/
